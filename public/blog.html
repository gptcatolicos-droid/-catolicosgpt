<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Blog CatolicosGPT · Artículos católicos de fe, doctrina y espiritualidad</title>
<meta name="description" content="Artículos católicos basados en el Magisterio. Doctrina, espiritualidad, vida de santos, liturgia y más. Por CatolicosGPT.">
<meta name="theme-color" content="#F6F0E3">
<link rel="canonical" href="https://catolicosgpt.com/blog">
<meta property="og:title" content="Blog CatolicosGPT · Artículos católicos">
<meta property="og:description" content="Artículos católicos basados en el Magisterio">
<meta property="og:url" content="https://catolicosgpt.com/blog">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<style>
.blog-shell { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }
.blog-hero { text-align: center; padding: 60px 20px 30px; }
.blog-hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 6vw, 56px); color: var(--espresso); line-height: 1.05; margin-bottom: 12px; }
.blog-hero h1 .it { font-style: italic; color: transparent; background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; }
.blog-hero p { font-family: var(--font-display); font-size: clamp(15px, 2.2vw, 18px); color: var(--ink-2); max-width: 640px; margin: 0 auto; }

.filter-bar { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 28px auto 40px; flex-wrap: wrap; max-width: 1000px; }
.filter-input { flex: 1; min-width: 200px; max-width: 380px; padding: 11px 18px; font-size: 14px; background: #fff; border: 1px solid var(--hairline-2); border-radius: 99px; font-family: var(--font-ui); }
.filter-input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
.cat-chip { padding: 7px 14px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--cream-2); border: 1px solid var(--hairline); border-radius: 99px; cursor: pointer; transition: .15s; }
.cat-chip:hover { color: var(--espresso); border-color: var(--gold); }
.cat-chip.active { background: var(--espresso); color: #f3e4c6; border-color: var(--espresso); }

.posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; padding-bottom: 60px; }
.post-card { background: #fff; border: 1px solid var(--hairline); border-radius: 16px; overflow: hidden; transition: .2s var(--ease); text-decoration: none; color: inherit; display: flex; flex-direction: column; }
.post-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--gold); }
.post-card-img { aspect-ratio: 16/9; background: var(--cream-2); overflow: hidden; }
.post-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-card-body { padding: 18px 20px 20px; flex: 1; display: flex; flex-direction: column; }
.post-card-cat { display: inline-block; padding: 3px 10px; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); background: rgba(188,138,54,.1); border-radius: 99px; margin-bottom: 10px; align-self: flex-start; }
.post-card-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--espresso); line-height: 1.3; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-card-excerpt { font-size: 14px; color: var(--ink-2); line-height: 1.5; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; }
.post-card-meta { font-size: 12px; color: var(--ink-3); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--ink-3); grid-column: 1/-1; }
.empty-state h2 { font-family: var(--font-display); color: var(--ink-2); margin-bottom: 8px; }

@media (max-width: 768px) {
  .nav { padding: 8px 12px; height: 56px; }
  .brand-mark { width: 28px; height: 28px; }
  .brand-word { font-size: 15px; }
  .nav-link:not(.active):not(.nav-user) { display: none; }
  .blog-hero { padding: 36px 16px 20px; }
  .posts-grid { grid-template-columns: 1fr; gap: 16px; }
}
</style>
</head>
<body>

<header class="nav">
  <a href="/" class="brand" style="text-decoration:none">
    <div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--gold-deep)" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 5v13M8 9h8"/></svg></div>
    <span class="brand-word">Católicos<span class="gpt">GPT</span></span>
  </a>
  <nav class="nav-links">
    <a class="nav-link" href="/infografias">Infografías</a>
    <a class="nav-link" href="/videos">Videos</a>
    <a class="nav-link" href="/podcast">Podcast</a>
    <a class="nav-link" href="/">Chat IA</a>
    <a class="nav-link active" href="/blog">Blog</a>
    <a class="nav-link" href="/misas">Misas</a>
    <a class="nav-link" href="/planes">Planes</a>
  </nav>
</header>

<div class="blog-shell">
  <section class="blog-hero">
    <h1>Blog <span class="it">Católico</span></h1>
    <p>Artículos sobre fe, doctrina, santos y espiritualidad. Basados en el Magisterio de la Iglesia.</p>
  </section>

  <div class="filter-bar">
    <input type="text" class="filter-input" id="search" placeholder="🔍 Buscar artículos..." oninput="filtrar()">
    <button class="cat-chip active" data-cat="" onclick="setCat('', this)">Todas</button>
    <button class="cat-chip" data-cat="doctrina" onclick="setCat('doctrina', this)">Doctrina</button>
    <button class="cat-chip" data-cat="espiritualidad" onclick="setCat('espiritualidad', this)">Espiritualidad</button>
    <button class="cat-chip" data-cat="santos" onclick="setCat('santos', this)">Santos</button>
    <button class="cat-chip" data-cat="liturgia" onclick="setCat('liturgia', this)">Liturgia</button>
    <button class="cat-chip" data-cat="magisterio" onclick="setCat('magisterio', this)">Magisterio</button>
    <button class="cat-chip" data-cat="oracion" onclick="setCat('oracion', this)">Oración</button>
    <button class="cat-chip" data-cat="familia" onclick="setCat('familia', this)">Familia</button>
    <button class="cat-chip" data-cat="apologetica" onclick="setCat('apologetica', this)">Apologética</button>
  </div>

  <div id="grid" class="posts-grid"></div>
</div>

<footer style="background:var(--cream-3);padding:30px 20px;text-align:center;border-top:1px solid var(--hairline);color:var(--ink-3);font-size:13px">
  © 2026 <a href="/" style="color:var(--gold-deep);text-decoration:none;font-weight:600">CatolicosGPT</a> · <a href="/infografias" style="color:var(--gold-deep);text-decoration:none">Infografías</a> · <a href="/videos" style="color:var(--gold-deep);text-decoration:none">Videos</a> · <a href="/podcast" style="color:var(--gold-deep);text-decoration:none">Podcast</a> · <a href="/blog" style="color:var(--gold-deep);text-decoration:none">Blog</a>
</footer>

<script>
let currentCat = '';
let currentQ = '';
const _urlParams = new URLSearchParams(window.location.search);
if (_urlParams.get('q')) { currentQ = _urlParams.get('q'); }
if (_urlParams.get('categoria')) { currentCat = _urlParams.get('categoria'); }

setTimeout(() => {
  if (currentQ) { const s = document.getElementById('search'); if (s) s.value = currentQ; }
  if (currentCat) document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('active', c.dataset.cat === currentCat));
}, 50);

let searchTimer;
function filtrar() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentQ = document.getElementById('search').value;
    loadPosts();
  }, 250);
}

function setCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  loadPosts();
}

async function loadPosts() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="empty-state">⏳ Cargando...</div>';
  try {
    const params = new URLSearchParams();
    if (currentCat) params.set('categoria', currentCat);
    if (currentQ) params.set('q', currentQ);
    params.set('limit', '60');
    const r = await fetch('/api/blog?' + params.toString());
    const d = await r.json();
    if (!d.items || !d.items.length) {
      grid.innerHTML = `<div class="empty-state"><h2>Sin artículos por ahora</h2><p>${currentQ ? 'No hay resultados para "' + currentQ + '"' : 'Pronto publicaremos nuevos artículos.'}</p></div>`;
      return;
    }
    grid.innerHTML = d.items.map(p => {
      const img = p.imagenDestacada || '';
      const titulo = (p.titulo || '').replace(/</g, '&lt;');
      const extracto = (p.extracto || p.descripcion || '').replace(/</g, '&lt;');
      const fechaFmt = new Date(p.fechaCreacion).toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'});
      return `
        <a class="post-card" href="/blog/${p.slug}">
          ${img ? `<div class="post-card-img"><img src="${img}" alt="${(p.altText || titulo).replace(/"/g, '&quot;')}" loading="lazy"></div>` : `<div class="post-card-img" style="display:grid;place-items:center;font-size:48px;color:var(--gold-deep)">📖</div>`}
          <div class="post-card-body">
            <span class="post-card-cat">${p.categoria || 'artículo'}</span>
            <h3 class="post-card-title">${titulo}</h3>
            <p class="post-card-excerpt">${extracto || 'Lee el artículo completo →'}</p>
            <div class="post-card-meta">📅 ${fechaFmt}</div>
          </div>
        </a>
      `;
    }).join('');
  } catch(e) {
    grid.innerHTML = `<div class="empty-state">Error: ${e.message}</div>`;
  }
}

loadPosts();
</script>
</body>
</html>
